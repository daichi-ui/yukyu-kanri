<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="有給管理">
  <title>有給管理</title>
  <!-- アイコン（ホーム画面・ブラウザのタブ） -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 読み込み中 -->
  <div id="loading" class="loading">
    <div class="spinner" aria-label="読み込み中"></div>
  </div>

  <!-- ログイン画面 -->
  <section id="loginView" class="login" hidden>
    <img class="login-icon" src="icon-192.png" alt="" width="88" height="88">
    <h1 class="login-title">有給管理</h1>
    <p class="login-text">有給休暇とアニバーサリー休暇の<br>残日数をかんたんに管理</p>
    <button id="loginBtn" class="btn btn-primary btn-large">Googleでログイン</button>
    <p id="loginError" class="msg error"></p>
  </section>

  <!-- メイン画面 -->
  <div id="appView" class="app" hidden>
    <!-- 上部のナビゲーションバー（スクロールすると小さいタイトルが出る） -->
    <header id="navbar" class="navbar">
      <span id="navTitle" class="navbar-title">ホーム</span>
    </header>

    <main class="main">
      <!-- 大きなタイトル -->
      <div class="title-row">
        <div class="title-text">
          <p id="todayText" class="title-eyebrow"></p>
          <h1 id="pageTitle" class="large-title">ホーム</h1>
        </div>
        <button id="accountBtn" class="avatar" aria-label="アカウント">
          <img id="avatarImg" alt="" hidden referrerpolicy="no-referrer">
          <span id="avatarText"></span>
        </button>
      </div>

      <!-- ===== ホーム ===== -->
      <section id="tab-home" class="page" data-title="ホーム">
        <div id="homeSummary" class="summary"></div>
        <div id="homeWork" class="work-card"></div>

        <button id="homeAddBtn" class="btn btn-primary btn-block btn-add">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>休みを登録
        </button>

        <h2 id="homeMonthTitle" class="group-title"></h2>
        <div id="homeMonth" class="list"></div>
      </section>

      <!-- ===== カレンダー ===== -->
      <section id="tab-calendar" class="page" data-title="カレンダー" hidden>
        <div class="group cal">
          <div class="cal-head">
            <h2 id="calTitle" class="cal-title"></h2>
            <div class="cal-navs">
              <button id="calToday" class="nav-link">今日</button>
              <button id="calPrev" class="cal-nav" aria-label="前の月">
                <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
              </button>
              <button id="calNext" class="cal-nav" aria-label="次の月">
                <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
              </button>
            </div>
          </div>

          <div class="cal-week">
            <span class="is-sun">日</span><span>月</span><span>火</span><span>水</span>
            <span>木</span><span>金</span><span class="is-sat">土</span>
          </div>
          <div id="calGrid" class="cal-grid"></div>

          <div class="cal-foot">
            <div class="cal-legend">
              <span><i class="mark mark-paid"></i>有給</span>
              <span><i class="mark mark-anniversary"></i>アニバ</span>
              <span><i class="mark mark-paid is-planned"></i>予定</span>
              <span><i class="legend-work"></i>出勤</span>
              <span><i class="legend-star">★</i>付与</span>
            </div>
            <span id="calMonthTotal" class="cal-total"></span>
          </div>
        </div>

        <h2 id="calDetailTitle" class="group-title"></h2>
        <div id="calDetail" class="list"></div>
        <button id="calAddBtn" class="btn btn-tinted btn-block cal-add">この日に登録</button>
      </section>

      <!-- ===== 管理（付与・土曜出勤） ===== -->
      <section id="tab-grants" class="page" data-title="管理" hidden>
        <!-- 切り替えボタン（iOS のセグメントコントロール） -->
        <div class="segmented" role="tablist">
          <span class="segment-indicator" aria-hidden="true"></span>
          <button type="button" class="segment active" data-seg="grants" role="tab">付与</button>
          <button type="button" class="segment" data-seg="workdays" role="tab">土曜出勤</button>
        </div>

        <div id="seg-grants" class="seg-page">
        <form id="grantForm">
          <h2 id="grantFormTitle" class="group-title">付与を登録</h2>
          <div class="group">
            <label class="field">
              <span class="field-label">種別</span>
              <select id="grantType">
                <option value="paid">有給休暇</option>
                <option value="anniversary">アニバーサリー休暇</option>
              </select>
            </label>

            <label class="field">
              <span class="field-label">付与年</span>
              <select id="grantYear"></select>
            </label>

            <label class="field">
              <span class="field-label">付与日数</span>
              <input type="number" id="grantDays" min="0" step="any" inputmode="decimal" placeholder="20" required>
            </label>

            <div class="field">
              <span class="field-label">付与日</span>
              <span id="grantDateText" class="field-value">-</span>
            </div>

            <div class="field">
              <span class="field-label">有効期限</span>
              <span id="grantExpire" class="field-value">-</span>
            </div>

            <label class="field">
              <span class="field-label">メモ</span>
              <input type="text" id="grantMemo" maxlength="100" placeholder="任意">
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" id="grantSubmit" class="btn btn-primary btn-block">登録する</button>
            <button type="button" id="grantCancel" class="btn btn-plain btn-block" hidden>キャンセル</button>
          </div>
          <p id="grantMsg" class="msg"></p>
        </form>

        <h2 class="group-title">付与の一覧</h2>
        <div id="grantList" class="list"></div>
        </div>

        <!-- 土曜出勤日 -->
        <div id="seg-workdays" class="seg-page" hidden>
          <form id="workForm">
            <h2 class="group-title">土曜出勤日を追加</h2>
            <div class="group">
              <label class="field">
                <span class="field-label">日付</span>
                <input type="date" id="workDate" required>
              </label>
              <label class="field">
                <span class="field-label">メモ</span>
                <input type="text" id="workMemo" maxlength="100" placeholder="任意">
              </label>
            </div>
            <p class="group-note">追加すると、日付が自動で次の週の土曜日に進みます。続けて入力できます。</p>

            <div class="form-actions">
              <button type="submit" id="workSubmit" class="btn btn-primary btn-block">追加する</button>
            </div>
            <p id="workMsg" class="msg"></p>
          </form>

          <div id="workList"></div>
        </div>
      </section>
    </main>

    <!-- 下部タブ -->
    <nav class="tabbar">
      <span class="tab-indicator" aria-hidden="true"></span>
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>ホーム</span>
      </button>
      <button class="tab" data-tab="calendar">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>カレンダー</span>
      </button>
      <button class="tab" data-tab="grants">
        <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <span>管理</span>
      </button>
    </nav>
  </div>

  <!-- アカウントのメニュー（下から出るアクションシート） -->
  <dialog id="accountSheet" class="action-sheet">
    <div class="action-group">
      <div class="action-header">
        <span class="action-header-title">ログイン中のアカウント</span>
        <span id="accountEmail" class="action-header-sub"></span>
      </div>
      <button type="button" id="logoutBtn" class="action-button action-danger">ログアウト</button>
    </div>
    <div class="action-group">
      <button type="button" id="accountCancel" class="action-button action-bold">キャンセル</button>
    </div>
  </dialog>

  <!-- 取得・予定の入力画面（下から出るシート） -->
  <dialog id="leaveDialog" class="sheet">
    <form id="leaveForm">
      <div class="sheet-bar">
        <button type="button" id="leaveCancel" class="nav-link">キャンセル</button>
        <h2 id="leaveFormTitle" class="sheet-title">取得・予定を登録</h2>
        <button type="submit" id="leaveSubmit" class="nav-link nav-link-bold">登録する</button>
      </div>

      <div class="group">
        <label class="field">
          <span class="field-label">日付</span>
          <input type="date" id="leaveDate" required>
        </label>

        <div class="field field-stack">
          <span class="field-label">種別</span>
          <div class="choice choice-type" data-for="leaveType" role="group" aria-label="種別">
            <button type="button" data-value="paid">有給休暇</button>
            <button type="button" data-value="anniversary">アニバーサリー</button>
          </div>
          <select id="leaveType" hidden>
            <option value="paid">有給休暇</option>
            <option value="anniversary">アニバーサリー休暇</option>
          </select>
        </div>

        <div class="field field-stack">
          <span class="field-label">取得種類</span>
          <div class="choice" data-for="leaveKind" role="group" aria-label="取得種類">
            <button type="button" data-value="full">全休</button>
            <button type="button" data-value="am">午前半休</button>
            <button type="button" data-value="pm">午後半休</button>
            <button type="button" data-value="hour">時間休</button>
          </div>
          <select id="leaveKind" hidden>
            <option value="full">全休（1日）</option>
            <option value="am">午前半休（0.5日）</option>
            <option value="pm">午後半休（0.5日）</option>
            <option value="hour">時間休</option>
          </select>
        </div>

        <div id="leaveHoursField" class="field field-stack" hidden>
          <span class="field-label">時間数</span>
          <div class="choice choice-hours" data-for="leaveHours" role="group" aria-label="時間数">
            <button type="button" data-value="1">1h</button>
            <button type="button" data-value="2">2h</button>
            <button type="button" data-value="3">3h</button>
            <button type="button" data-value="4">4h</button>
            <button type="button" data-value="5">5h</button>
            <button type="button" data-value="6">6h</button>
            <button type="button" data-value="7">7h</button>
          </div>
          <select id="leaveHours" hidden>
            <option value="1">1時間</option>
            <option value="2">2時間</option>
            <option value="3">3時間</option>
            <option value="4">4時間</option>
            <option value="5">5時間</option>
            <option value="6">6時間</option>
            <option value="7">7時間</option>
          </select>
        </div>

        <label class="field">
          <span class="field-label">メモ</span>
          <input type="text" id="leaveMemo" maxlength="100" placeholder="任意（旅行、通院など）">
        </label>
      </div>
      <p class="group-note">時間休は 8時間で1日として計算します。</p>

      <div class="group" id="leaveDeleteGroup">
        <button type="button" id="leaveDelete" class="row-button row-danger" hidden>この登録を削除</button>
      </div>
      <p id="leaveMsg" class="msg"></p>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
