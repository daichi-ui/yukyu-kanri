<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d6d">
  <title>有給管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 読み込み中 -->
  <div id="loading" class="loading">読み込み中...</div>

  <!-- ログイン画面 -->
  <section id="loginView" class="login" hidden>
    <h1 class="login-title">有給管理</h1>
    <p class="login-text">有給休暇とアニバーサリー休暇の<br>残日数を管理します</p>
    <button id="loginBtn" class="btn btn-primary">Googleでログイン</button>
    <p id="loginError" class="error"></p>
  </section>

  <!-- メイン画面 -->
  <div id="appView" class="app" hidden>
    <header class="header">
      <h1 id="pageTitle" class="header-title">ホーム</h1>
      <button id="logoutBtn" class="btn-text">ログアウト</button>
    </header>

    <main class="main">
      <section id="tab-home" class="page" data-title="ホーム">
        <p class="placeholder">残日数をここに表示します（準備中）</p>
      </section>

      <section id="tab-calendar" class="page" data-title="カレンダー" hidden>
        <p class="placeholder">カレンダーをここに表示します（準備中）</p>
      </section>

      <section id="tab-history" class="page" data-title="履歴" hidden>
        <button id="leaveAddBtn" class="btn btn-primary btn-block">＋ 取得・予定を登録</button>

        <h2 class="section-title">予定</h2>
        <div id="plannedList" class="list"></div>

        <h2 class="section-title">取得済み</h2>
        <div id="takenList" class="list"></div>
      </section>

      <section id="tab-grants" class="page" data-title="付与管理" hidden>
        <form id="grantForm" class="card">
          <h2 id="grantFormTitle" class="card-title">付与を登録</h2>

          <label class="field">
            <span class="field-label">休暇の種別</span>
            <select id="grantType">
              <option value="paid">有給休暇</option>
              <option value="anniversary">アニバーサリー休暇</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">付与日</span>
            <input type="date" id="grantDate" required>
          </label>

          <label class="field">
            <span class="field-label">付与日数</span>
            <input type="number" id="grantDays" min="0" step="any" inputmode="decimal" placeholder="例：20" required>
          </label>

          <p class="field-note">有効期限：<strong id="grantExpire">-</strong></p>

          <label class="field">
            <span class="field-label">メモ（任意）</span>
            <input type="text" id="grantMemo" maxlength="100" placeholder="例：前年度の繰越分">
          </label>

          <div class="form-actions">
            <button type="button" id="grantCancel" class="btn btn-sub" hidden>キャンセル</button>
            <button type="submit" id="grantSubmit" class="btn btn-primary">登録する</button>
          </div>
          <p id="grantMsg" class="msg"></p>
        </form>

        <h2 class="section-title">付与の一覧</h2>
        <div id="grantList" class="list"></div>
      </section>
    </main>

    <!-- 下部タブ -->
    <nav class="tabbar">
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>ホーム</span>
      </button>
      <button class="tab" data-tab="calendar">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>カレンダー</span>
      </button>
      <button class="tab" data-tab="history">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span>履歴</span>
      </button>
      <button class="tab" data-tab="grants">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>付与</span>
      </button>
    </nav>
  </div>

  <!-- 取得・予定の入力画面（下から出る） -->
  <dialog id="leaveDialog" class="sheet">
    <form id="leaveForm">
      <h2 id="leaveFormTitle" class="card-title">取得・予定を登録</h2>

      <label class="field">
        <span class="field-label">日付</span>
        <input type="date" id="leaveDate" required>
      </label>

      <label class="field">
        <span class="field-label">休暇の種別</span>
        <select id="leaveType">
          <option value="paid">有給休暇</option>
          <option value="anniversary">アニバーサリー休暇</option>
        </select>
      </label>

      <label class="field">
        <span class="field-label">取得種類</span>
        <select id="leaveKind">
          <option value="full">全休（1日）</option>
          <option value="am">午前半休（0.5日）</option>
          <option value="pm">午後半休（0.5日）</option>
          <option value="hour">時間休</option>
        </select>
      </label>

      <label id="leaveHoursField" class="field" hidden>
        <span class="field-label">時間数（8時間＝1日）</span>
        <select id="leaveHours">
          <option value="1">1時間</option>
          <option value="2">2時間</option>
          <option value="3">3時間</option>
          <option value="4">4時間</option>
          <option value="5">5時間</option>
          <option value="6">6時間</option>
          <option value="7">7時間</option>
        </select>
      </label>

      <label class="field">
        <span class="field-label">メモ（任意）</span>
        <input type="text" id="leaveMemo" maxlength="100" placeholder="例：旅行、通院など">
      </label>

      <div class="form-actions">
        <button type="button" id="leaveCancel" class="btn btn-sub">キャンセル</button>
        <button type="submit" id="leaveSubmit" class="btn btn-primary">登録する</button>
      </div>
      <button type="button" id="leaveDelete" class="btn-delete" hidden>この登録を削除</button>
      <p id="leaveMsg" class="msg"></p>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
